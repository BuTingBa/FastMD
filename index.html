    <!--
        动态计算项目根路径并写入 <base> 标签。
        这样无论本项目被部署在网站根目录，还是任意层级的子目录（如 /a/b/wiki/），
        所有相对路径引用（css/js/fetch）都能基于该 base 正确解析，彻底避免 404。
        注意：<base> 必须在所有资源引用之前生成，故使用同步 document.write。
        关键：兼容「访问目录但未带末尾斜杠」的情况（如 /doc 而非 /doc/），
        否则浏览器会把最后一段当成文件名，导致 base 计算少一层目录。
    -->
    <script>
        (function () {
            var path = window.location.pathname;
            var lastSlash = path.lastIndexOf('/');
            var lastSegment = path.substring(lastSlash + 1);
            var base;
            // 最后一段不含点（无扩展名），视为目录访问（如 /doc 或 /a/b/wiki）
            // 此时 base 应包含该段并补斜杠
            if (lastSegment && lastSegment.indexOf('.') === -1) {
                base = path + '/';
                // 同步修正地址栏，避免后续 hash 路由与相对路径混乱
                history.replaceState(null, '', base + window.location.search + window.location.hash);
            } else {
                // 取最后一个 / 之前的部分（含末尾 /），作为项目根目录
                base = path.substring(0, lastSlash + 1);
            }
            document.write('<base href="' + base + '">');
        })();
    </script>

    <!-- 全局配置（站点标题 / 后端接口地址），必须在 main.js 之前引入 -->
    <script src="config.js?v=202609081442"></script>
    <script>
        /**
         * ================= 框架内部全局变量（一般无需修改，配置请改 config.js） =================
         * 供 assets/main.js / assets/app.js 全局引用。必须先于 main.js 加载。
         */

        // 站点标题（main.js 中页面标题后缀使用）
        window.SITE_TITLE = window.FASTMD_CONFIG.siteTitle || 'FastMD';

        // 后端接口地址
        window.API_ENDPOINT = window.FASTMD_CONFIG.apiEndpoint || 'api/php';

        /**
         * 拼接后端接口地址：apiEndpoint + '/sidebar' 或 '/search'（路径式路由）
         * - 自动去掉末尾斜杠："http://host:8300/" → "http://host:8300/sidebar"
         * - 接口地址自带查询参数时（如 "http://host/api?token=1"），
         *   路径已不可追加，退回查询参数方式 &action=xxx
         */
        window.apiUrl = function (action) {
            var ep = window.API_ENDPOINT;
            if (ep.indexOf('?') !== -1) {
                return ep + '&action=' + action;
            }
            return ep.replace(/\/+$/, '') + '/' + action;
        };

        /**
         * 发起后端 API 请求：路径式（/sidebar、/search）优先，
         * 失败（404/网络错误）时自动回退查询参数方式（?action=xxx）。
         * 兼容不支持 PATH_INFO 的服务器（如未配置 rewrite 的 nginx、php -S 内置服务器）；
         * 静态 JSON 方案（api/file/）由静态服务器直接命中文件，不走回退。
         */
        window.fetchApi = async function (action) {
            try {
                const res = await fetch(window.apiUrl(action));
                if (res.ok) return res;
            } catch (e) { /* 落入下方查询参数重试 */ }
            return fetch(window.API_ENDPOINT + (window.API_ENDPOINT.indexOf('?') !== -1 ? '&' : '?') + 'action=' + action);
        };
    </script>
